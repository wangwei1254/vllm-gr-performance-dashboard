site_name: vllm-gr Performance Dashboard
site_description: Daily vllm-gr beam-search performance and AgentCache benchmark dashboards.

docs_dir: docs
site_dir: site

theme:
  name: mkdocs
  custom_dir: overrides

nav:
  - AgentCache Dashboard: index.md
  - vllm-gr Performance: vllm-gr.md
  - vllm-gr Beam Results: vllm-gr-beam-results.md
  - vllm-gr Data Format: vllm-gr-data-format.md

exclude_docs: |
  README.md

extra_css:
  - stylesheets/dashboard.css
  - stylesheets/vllm-gr-dashboard.css

extra_javascript:
  - javascripts/dashboard.js
  - javascripts/vllm-gr-dashboard.js?v=20260918-4

markdown_extensions:
  - tables
  - toc:
      permalink: true
